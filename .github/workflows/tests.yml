name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [teaching_pipeline, teaching_pipeline_v2]
        python: ["3.11", "3.12"]
    name: ${{ matrix.version }} / py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.version }}/requirements.txt

      - name: Install dependencies (CPU-only torch)
        working-directory: ${{ matrix.version }}
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Environment check
        working-directory: ${{ matrix.version }}
        run: python check_env.py

      - name: Unit tests
        working-directory: ${{ matrix.version }}
        run: python -m pytest -q tests

      - name: Smoke run (tiny end-to-end pipeline)
        working-directory: ${{ matrix.version }}
        run: python run_all.py --preset quick --channels 4 --epochs 2 --out results/ci_smoke
